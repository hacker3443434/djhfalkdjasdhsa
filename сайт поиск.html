<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Супер CodeLive</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<style>
body { font-family: Arial; padding: 20px; background: #f5f5f5; }
#editor { height: 400px; border: 1px solid #ccc; margin-bottom: 10px; }
#output { background: #000; color: #0f0; padding: 10px; height: 250px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 20px; }
select, button, input { padding: 5px; margin: 5px 0; }
#examples, #algorithms, #gameSection { margin-top: 20px; border: 1px solid #aaa; padding: 10px; background: #eef; }
</style>
</head>
<body>

<h2>Супер CodeLive</h2>

<label for="language">Мова програмування:</label>
<select id="language">
    <option value="python">Python</option>
    <option value="javascript">JavaScript</option>
    <option value="cpp">C++</option>
    <option value="java">Java</option>
</select>

<div id="examples">
<label>Приклад коду:</label>
<select id="exampleSelect">
    <option value="hello">Hello World</option>
    <option value="loops">Цикли</option>
    <option value="function">Функція</option>
</select>
</div>

<div id="editor"></div>
<button id="runBtn">Виконати</button>

<h3>Результат:</h3>
<div id="output"></div>

<h3>Маленькі алгоритми</h3>
<div id="algorithms">
<button id="fibBtn">Фібоначчі</button>
<button id="factorialBtn">Факторіал</button>
<div id="algoOutput"></div>
</div>

<h3>Інтерактивна гра "Вгадай число" (Python)</h3>
<div id="gameSection">
<input type="text" id="userInput" placeholder="Введіть число">
<button id="sendBtn">Відправити</button>
<div id="gameOutput"></div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>

<script>
// ===================== РЕДАКТОР =====================
const editor = CodeMirror(document.getElementById('editor'), {
    mode: 'python',
    lineNumbers: true,
    value: "# Введіть свій код тут\nprint('Hello World')"
});

const languageModes = {
    python: 'python',
    javascript: 'javascript',
    cpp: 'text/x-c++src',
    java: 'text/x-java'
};

const examples = {
    python: {
        hello: "print('Hello Python World')",
        loops: "for i in range(5):\n    print(i)",
        function: "def add(a,b):\n    return a+b\nprint(add(3,4))"
    },
    javascript: {
        hello: "console.log('Hello JS World');",
        loops: "for(let i=0;i<5;i++){console.log(i);}",
        function: "function add(a,b){return a+b;}\nconsole.log(add(3,4));"
    },
    cpp: {
        hello: "#include <iostream>\nint main(){std::cout << 'Hello C++ World'; return 0;}",
        loops: "#include <iostream>\nint main(){for(int i=0;i<5;i++){std::cout<<i<<' ';} return 0;}",
        function: "#include <iostream>\nint add(int a,int b){return a+b;}\nint main(){std::cout<<add(3,4); return 0;}"
    },
    java: {
        hello: "public class Main{public static void main(String[] args){System.out.println('Hello Java World');}}",
        loops: "public class Main{public static void main(String[] args){for(int i=0;i<5;i++){System.out.println(i);}}}",
        function: "public class Main{static int add(int a,int b){return a+b;} public static void main(String[] args){System.out.println(add(3,4));}}"
    }
};

document.getElementById('language').addEventListener('change', e=>{
    const lang=e.target.value;
    editor.setOption('mode',languageModes[lang]);
    const exampleKey=document.getElementById('exampleSelect').value;
    editor.setValue(examples[lang][exampleKey]);
});

document.getElementById('exampleSelect').addEventListener('change', ()=>{
    const lang=document.getElementById('language').value;
    const exampleKey=document.getElementById('exampleSelect').value;
    editor.setValue(examples[lang][exampleKey]);
});

// ===================== Виконання коду =====================
let pyodideReady = false;
let pyodide;
let inputResolve;

async function loadPy() {
    pyodide = await loadPyodide();
    pyodideReady = true;

    // JS-функція для заміни input() у Python
    pyodide.globals.set("js_input",(promptText)=>{
        return new Promise(resolve=>{
            inputResolve = resolve;
            document.getElementById("gameOutput").textContent += promptText + "\n";
        });
    });
}
loadPy();

document.getElementById('runBtn').addEventListener('click', async ()=>{
    const code=editor.getValue();
    const lang=document.getElementById('language').value;
    const outputDiv=document.getElementById('output');
    outputDiv.textContent='Виконання...';

    if(lang==='javascript'){
        try{
            const result=eval(code);
            outputDiv.textContent=result!==undefined?result:'Код виконано';
        }catch(e){
            outputDiv.textContent='Помилка: '+e;
        }
    } else if(lang==='python'){
        if(!pyodideReady){
            outputDiv.textContent='Підготовка Python... зачекайте.';
            return;
        }
        try{
            const asyncCode=`
import asyncio
async def input_py(prompt=""):
    return await js_input(prompt)

async def user_code():
${code.split("\n").map(l=>"    "+l).join("\n")}

asyncio.create_task(user_code())
            `;
            await pyodide.runPythonAsync(asyncCode);
            outputDiv.textContent='Код виконано (Python інтерактивно)';
        }catch(e){
            outputDiv.textContent='Помилка Python: '+e;
        }
    } else {
        // Piston API для C++/Java
        try{
            const response=await fetch('https://emkc.org/api/v2/piston/execute',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({language:lang, source:code})
            });
            const data=await response.json();
            outputDiv.textContent=data.output||'Помилка виконання';
        }catch(e){
            outputDiv.textContent='Помилка API: '+e;
        }
    }
});

// ===================== Введення для Python =====================
document.getElementById('sendBtn').addEventListener('click', ()=>{
    const value=document.getElementById('userInput').value;
    document.getElementById('userInput').value="";
    document.getElementById('gameOutput').textContent+=value+"\n";
    if(inputResolve){
        inputResolve(value);
        inputResolve=null;
    }
});

// ===================== Маленькі алгоритми =====================
const algoOutput=document.getElementById('algoOutput');

document.getElementById('fibBtn').addEventListener('click', ()=>{
    const n=10;
    let fib=[0,1];
    for(let i=2;i<n;i++) fib[i]=fib[i-1]+fib[i-2];
    algoOutput.textContent=`Перші ${n} чисел Фібоначчі:\n`+fib.join(', ');
});

document.getElementById('factorialBtn').addEventListener('click', ()=>{
    const n=6;
    let fact=1;
    for(let i=1;i<=n;i++) fact*=i;
    algoOutput.textContent=`${n}! = ${fact}`;
});
</script>
</body>
</html>
